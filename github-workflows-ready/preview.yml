name: Preview Build (Pull Requests)

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    name: Validate Content, Consent Rule & Static Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (no deploy)
        run: npm run build

      - name: Verify dist/index.html exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing!"
            exit 1
          fi
          echo "Preview build succeeded."
