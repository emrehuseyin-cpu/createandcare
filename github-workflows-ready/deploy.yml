name: Build & Deploy (cPanel Git / FTPS)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  schedule:
    # Weekly rebuild every Monday at 05:00 UTC so the "Road trip" timeline
    # updates past/current/future stops automatically even when nobody pushes.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Static Site & Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing! Aborting deploy."
            exit 1
          fi
          echo "Build verification passed: dist/index.html found."

      - name: Commit updated dist/ for cPanel Git Version Control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --staged --quiet; then
            echo "No changes in dist/ to commit."
          else
            git commit -m "chore(build): update static dist/ for cPanel Git deployment [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy dist/ to HostGator via FTPS (if FTP_SERVER secret is configured)
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
